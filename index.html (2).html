const moviesEl=document.getElementById("movies"), booksEl=document.getElementById("books"),
      titleEl=document.getElementById("resultsTitle"), capesEl=document.getElementById("nocapes");
let current=null;

DATA.forEach((d,i)=>{
  const b=document.createElement("button");
  b.textContent=d.movie; b.setAttribute("aria-pressed","false");
  b.addEventListener("click",()=>{current=i;render();});
  moviesEl.appendChild(b);
});
capesEl.addEventListener("change",render);

function render(){
  [...moviesEl.children].forEach((b,i)=>b.setAttribute("aria-pressed",String(i===current)));
  if(current===null) return;
  titleEl.hidden=false;
  booksEl.textContent="";
  let list=DATA[current].books;
  if(capesEl.checked) list=list.filter(b=>!b[3]);
  if(!list.length){
    const p=document.createElement("p"); p.className="empty";
    p.textContent="Every pick for this one has a cape. Untick the filter to see them, or try another movie.";
    booksEl.appendChild(p); return;
  }
  list.forEach(([t,by,why,sh])=>{
    const c=document.createElement("div"); c.className="card";
    if(sh){const g=document.createElement("span"); g.className="tag"; g.textContent="SUPERHERO"; c.appendChild(g);}
    const h=document.createElement("h3"); h.textContent=t;
    const a=document.createElement("p"); a.className="by"; a.textContent=by;
    const p=document.createElement("p"); p.textContent=why;
    const l=document.createElement("a"); l.textContent="Find a copy near you";
    l.href="https://search.worldcat.org/search?q="+encodeURIComponent(t);
    l.target="_blank"; l.rel="noopener";
    c.append(h,a,p,l); booksEl.appendChild(c);
  });
}

const qEl=document.getElementById("q"), chipsEl=document.getElementById("chips"), countEl=document.getElementById("count");
const GEN=["All",...new Set(DATA.map(d=>d.genre))];
let genre="All";

function drawChips(){
  chipsEl.textContent="";
  GEN.forEach(g=>{
    const b=document.createElement("button");
    b.textContent=g; b.setAttribute("aria-pressed",String(g===genre));
    b.onclick=()=>{genre=g;drawChips();drawMovies();};
    chipsEl.appendChild(b);
  });
}
function drawMovies(){
  moviesEl.textContent="";
  const q=qEl.value.trim().toLowerCase(), nc=capesEl.checked;
  const list=DATA.map((d,i)=>[d,i]).filter(([d])=>(genre==="All"||d.genre===genre)&&!(nc&&d.genre==="Superhero")&&d.movie.toLowerCase().includes(q));
  countEl.textContent=list.length+" movies";
  list.forEach(([d,i])=>{
    const b=document.createElement("button"), n=document.createElement("strong"), s=document.createElement("small");
    n.textContent=d.movie; s.textContent=d.genre; b.append(n,s);
    b.setAttribute("aria-pressed",String(i===current));
    b.onclick=()=>{current=i;render();drawMovies();titleEl.scrollIntoView({behavior:"smooth",block:"start"});};
    moviesEl.appendChild(b);
  });
}
function render(){
  if(current===null) return;
  const d=DATA[current];
  titleEl.hidden=false; titleEl.textContent="Liked "+d.movie+"? Start here";
  booksEl.textContent="";
  const list=capesEl.checked?d.books.filter(b=>!b[3]):d.books;
  if(!list.length){
    const p=document.createElement("p"); p.className="empty";
    p.textContent="Every pick for this one has a cape. Untick the filter to see them.";
    booksEl.appendChild(p); return;
  }
  list.forEach(([t,by,why,sh],n)=>{
    const c=document.createElement("div"); c.className="card";
    const num=document.createElement("span"); num.className="num"; num.textContent=n+1; c.appendChild(num);
    if(sh){const g=document.createElement("span"); g.className="tag"; g.textContent="SUPERHERO"; c.appendChild(g);}
    const h=document.createElement("h3"); h.textContent=t;
    const a=document.createElement("p"); a.className="by"; a.textContent=by;
    const p=document.createElement("p"); p.textContent=why;
    const l=document.createElement("a"); l.textContent="Find a copy near you";
    l.href="https://search.worldcat.org/search?q="+encodeURIComponent(t);
    l.target="_blank"; l.rel="noopener";
    c.append(h,a,p,l); booksEl.appendChild(c);
  });
}
qEl.addEventListener("input",drawMovies);
capesEl.addEventListener("change",drawMovies);

function setView(v){
  document.body.dataset.view=v;
  tabsEl.querySelectorAll("[data-v]").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===v)));
  if(v==="r")drawOrder();
}
function drawOrder(){
  const h=HR[hero];
  [...hchips.children].forEach((b,i)=>b.setAttribute("aria-pressed",String(i===hero)));
  const done=h.books.filter(b=>READ[b[0]]).length;
  ohead.textContent=""; olist.textContent="";
  const bar=el("div","prog"), fill=el("i"); fill.style.width=(100*done/h.books.length)+"%"; bar.appendChild(fill);
  ohead.append(el("h2","",h.name+" reading order"),el("p","sub",h.intro),bar,el("p","count",done+" of "+h.books.length+" read"));
  h.books.forEach(([t,by],n)=>{
    const c=el("div","card"); c.append(el("span","num",n+1));
    if(n===0)c.append(el("span","tag","START HERE"));
    const lab=el("label","opt"), cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!READ[t];
    cb.onchange=()=>{if(cb.checked)READ[t]=1;else delete READ[t];saveR();drawOrder();};
    lab.append(cb," Read it");
    c.append(el("h3","",t),el("p","by",by),lab,link(t));
    olist.appendChild(c);
  });
}
HR.forEach((h,i)=>{const b=el("button","",h.name);b.onclick=()=>{hero=i;drawOrder();};hchips.appendChild(b);});

let pub="All", oq=""; hero=-1;

function drawGrid(){
  otabs.textContent="";
  ["All","DC","Marvel","TMNT","Indie"].forEach(p=>{const b=el("button","",p);b.setAttribute("aria-pressed",String(p===pub));b.onclick=()=>{pub=p;drawOrder();};otabs.appendChild(b);});
  ogrid.textContent="";
  HR.forEach((h,i)=>{
    if((pub!=="All"&&grp(h.name)!==pub)||!h.name.toLowerCase().includes(oq))return;
    const m=META[h.name]||["",""], done=h.books.filter(b=>READ[b[0]]).length;
    const c=el("button","hcard"); c.style.setProperty("--g",gcol(h.name));
    c.append(el("span","pub",m[0]),el("strong","",h.name),el("small","",m[1]),el("em","",done+" of "+h.books.length+" read"));
    c.onclick=()=>{hero=i;drawOrder();scrollTo(0,0);};
    ogrid.appendChild(c);
  });
  if(!ogrid.children.length)ogrid.append(el("p","empty","No characters match."));
}
function drawOrder(){
  const open=hero>=0;
  show(obar,!open); show(ogrid,!open); show(ohead,open); show(olist,open);
  if(!open){drawGrid();return;}
  const h=HR[hero], m=META[h.name]||["",""];
  const seen=DATA.filter(d=>heroFor(d.movie)===hero).map(d=>d.movie);
  const done=h.books.filter(b=>READ[b[0]]).length, next=h.books.findIndex(b=>!READ[b[0]]);
  ohead.textContent=""; olist.textContent="";
  const back=el("button","back","\u2190 All characters"); back.onclick=()=>{hero=-1;drawOrder();};
  const rs=el("button","back","Reset progress"); rs.onclick=()=>{h.books.forEach(b=>delete READ[b[0]]);saveR();drawOrder();};
  const bar=el("div","prog"), fill=el("i"); fill.style.width=(100*done/h.books.length)+"%"; bar.appendChild(fill);
  ohead.append(back,rs,el("br"),el("span","pub",m[0]),el("h2","",h.name),el("p","who",m[1]));
  if(seen.length)ohead.append(el("p","seen","Seen in: "+seen.slice(0,5).join(", ")));
  ohead.append(el("p","sub",h.intro),bar,el("p","count",done+" of "+h.books.length+" read"+(next>=0?" \u00b7 next up: #"+(next+1):" \u00b7 all done!")));
  h.books.forEach(([t,by],n)=>{
    const c=el("div","card"+(n===next?" next":"")+(READ[t]?" read":"")), info=el("div","info");
    c.append(el("span","num",n+1),cover(t));
    if(n===0)info.append(el("span","tag","START HERE"));
    if(n===next&&n>0)info.append(el("span","tag","NEXT UP"));
    const lab=el("label","opt"), cb=document.createElement("input"); cb.type="checkbox"; cb.checked=!!READ[t];
    cb.onchange=()=>{if(cb.checked)READ[t]=1;else delete READ[t];saveR();drawOrder();};
    lab.append(cb," Read it");
    info.append(el("p","by",by),lab,link(t)); c.append(info); olist.appendChild(c);
  });
}
